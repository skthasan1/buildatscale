# Build@Scale with AI: checks on every pull request. Keeps VERSION and CHANGELOG.md consistent so a release cannot fail later.
name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-and-changelog:
    name: VERSION and CHANGELOG agree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check VERSION and CHANGELOG
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION must look like 1.2.3, got: $VERSION"; exit 1; }
          grep -q "^## \[${VERSION}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section '## [${VERSION}]'"; exit 1; }
          echo "OK: VERSION $VERSION has a changelog section."

# Build@Scale with AI — Starter CI Pipeline
#
# Copy this file to .github/workflows/ci.yml and customise the marked sections.
# Works for: web, API, mobile (build only), monorepo.
# Every PR must pass all jobs before merging — this is the CI gate the audit checklist assumes.
#
# ── COST OPTIMISATIONS (applied by default) ─────────────────────────────────
# 1. PR-to-main only — no CI on every dev push; saves 60–70% of minutes
# 2. Concurrency cancel — stale runs killed when a new commit arrives on the PR
# 3. Merged check job — typecheck + lint + test share one install instead of three
# 4. No build job — if Vercel/Railway/Render builds for you, drop it (see comment below)
# 5. paths-ignore — skip CI for docs-only or config-only changes
# ─────────────────────────────────────────────────────────────────────────────
#
# ── CUSTOMISE THESE ──────────────────────────────────────────────────────────
# 1. NODE_VERSION — match your .nvmrc or engines.node in package.json
# 2. PACKAGE_MANAGER — pnpm | npm | yarn
# 3. TEST_CMD — your test command (see examples in the check job)
# 4. paths-ignore — add your own docs/config paths
# 5. Remove or uncomment the build job depending on your deploy platform
# ─────────────────────────────────────────────────────────────────────────────

name: CI

# Cancel stale runs when a new commit arrives on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
      - "shared/**"   # framework files — no prod impact
  workflow_dispatch:  # manual trigger for milestone gates / full E2E

env:
  NODE_VERSION: "20"          # ← change to match your project
  PACKAGE_MANAGER: "pnpm"    # ← pnpm | npm | yarn | bun

jobs:

  # ── 1. Check (typecheck + lint + unit tests) ─────────────────────────────────
  # All three share one checkout + install. Saves ~2–3 min vs separate jobs.
  check:
    name: Check (typecheck + lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4         # ← remove if not using pnpm
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.PACKAGE_MANAGER }}
      - run: pnpm install --frozen-lockfile   # ← swap for npm ci / yarn install

      # TypeScript / type check
      - run: pnpm exec tsc --noEmit          # ← swap for: npm run typecheck, npx tsc --noEmit
      # Python: mypy .
      # Go: go vet ./...

      # Lint
      - run: pnpm lint                        # ← swap for: npm run lint, yarn lint
      # Python: ruff check .
      # Rust: cargo clippy -- -D warnings

      # Unit tests
      # ── choose your TEST_CMD ─────────────────────────────────────────────
      - run: pnpm test                    # single package
      # - run: pnpm -r test               # all packages in monorepo
      # - run: pnpm --filter api test     # specific monorepo package
      # - run: pytest                     # Python
      # - run: cargo test                 # Rust
      # - run: go test ./...              # Go
      # ─────────────────────────────────────────────────────────────────────
      env:
        NODE_ENV: test

  # ── 2. Secrets guard ─────────────────────────────────────────────────────────
  # Fails the build if any .env files or known secret patterns appear in the diff.
  # Cheap insurance — runs in seconds, no install needed.
  secrets-guard:
    name: Secrets guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to diff
      - name: Check for committed secrets
        run: |
          # Fail if any .env files were committed (except .env.example)
          if git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null | grep -E '^\.env(\.[^e]|$)'; then
            echo "❌ .env file committed — remove it and rotate any exposed secrets"
            exit 1
          fi
          # Fail if common secret patterns appear in changed files
          if git diff origin/${{ github.base_ref }}...HEAD 2>/dev/null | grep -E \
            '(AKIA[A-Z0-9]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|sk-[a-zA-Z0-9]{32,})'; then
            echo "❌ Possible secret pattern detected in diff"
            exit 1
          fi
          echo "✅ No secrets detected"

  # ── 3. Build verification (OPTIONAL — remove if your deploy platform builds for you) ──
  #
  # If you deploy via Vercel, Railway, Render, or Fly.io, those platforms build on
  # every PR and give you a preview URL. Running pnpm build here is redundant.
  # Only keep this job if you need a build artifact (Docker image, binary, etc.)
  # or your platform does NOT build on PRs.
  #
  # build:
  #   name: Build
  #   runs-on: ubuntu-latest
  #   needs: [check]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #       with: { version: 10 }
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm build                   # ← swap for your build command
  #     # Monorepo: pnpm -r build
  #     # Python: docker build . (if containerised)
  #     # Mobile (Expo): npx expo export (dry run — no device needed)

  # ── 4. E2E tests (optional — enable when you have them) ──────────────────────
  # Playwright E2E requires a running backend + live DB secrets.
  # Run manually (workflow_dispatch) or on release PRs only.
  #
  # e2e:
  #   name: E2E tests
  #   runs-on: ubuntu-latest
  #   needs: [check]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #       with: { version: 10 }
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm exec playwright install --with-deps chromium
  #     - run: pnpm test:e2e
  #       env:
  #         # Pass only what E2E needs — use GitHub Secrets for sensitive values
  #         DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
